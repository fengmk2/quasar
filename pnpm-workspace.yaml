packages:
  - app-vite
  - app-webpack
  - vite-plugin
  - vite-plugin/playground
  - extras
  - ui
  - ui/playground
  - ui/testing
  - create-quasar
  - cli
  - docs
  - utils/render-ssr-error
  - utils/ssl-certificate
  - utils/eslint-config
  - playground/app-vite-ts

# The packages below are not included. Use their individual folders.
# - icongenie
# - utils/babel-preset-app
# - utils/ssr-helpers

catalog:
  eslint: ^9.37.0
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  '@voidzero-dev/vite-plus': latest

onlyBuiltDependencies:
  - '@parcel/watcher'
  - core-js
  - esbuild
  - unrs-resolver
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
